name: Instructor workbench
on:
  push:
    paths: ['instructor/**', '.github/workflows/instructor.yml']
  pull_request:
    paths: ['instructor/**', '.github/workflows/instructor.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python instructor/build_bundle.py --check
      - run: python -m unittest discover -s instructor/tests -v
      - run: python instructor/build_bundle.py --check --zip instructor-workbench.zip
      - uses: actions/upload-artifact@v4
        with:
          name: instructor-workbench-${{ matrix.os }}
          path: |
            instructor-workbench.zip
            instructor-workbench.zip.sha256
